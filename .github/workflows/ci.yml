name: CI

# Minimal compile gate for PRs and main. Until this existed, the release
# workflow was the repo's only build check, so uncompilable merges could land
# on main unnoticed — v1.6.8 alone shipped three separate "repair main" fixes.
#
# Deliberately just `cargo check`: fast enough to gate every PR, and it
# compiles the lib, bins, tests, and benches without running anything.
#
# Plus one Windows job for install.ps1, which users run as `irm <url> | iex`
# under Windows PowerShell 5.1 or PowerShell 7 (issues #9 and #11).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check (lib, bins, tests, benches)
        run: cargo check --locked --all-targets

      # The release builds only the binary, without the test-support feature
      # that tests switch on. Check that build too, so code gated behind
      # test-support can't break a release while the line above passes.
      - name: Check (release binary, default features)
        run: cargo check --locked --bin autter

  # The release workflow was the first place the Windows build compiled, after
  # the tag existed, so a `#[cfg(windows)]` error could only be found by a
  # failed release. Compile the release binary for Windows on every PR.
  windows-check:
    name: cargo check (Windows)
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The binary only: the test targets have never been compiled on
      # Windows, and this job exists to protect the release build.
      - name: Check (release binary, default features)
        run: cargo check --locked --bin autter

  windows-installer:
    name: install.ps1 (Windows PowerShell 5.1 + pwsh)
    runs-on: blacksmith-4vcpu-windows-2025
    env:
      # Don't count CI runs as installs.
      AUTTER_NO_INSTALL_PING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pure ASCII, AST parse with this engine's parser, and no constructs that
      # break under iex (exit, top-level param(), $PSScriptRoot, unwrapped body).
      # 5.1's parser is the one that rejects PowerShell 7-only syntax. Also
      # that the dry run returns before any request and that every failed
      # download names the npm route.
      - name: Static checks (Windows PowerShell 5.1)
        shell: powershell
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5) {
            throw "expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion) $($PSVersionTable.PSEdition)"
          }
          & ./scripts/check-install-ps1.ps1
          exit $LASTEXITCODE

      - name: Static checks (pwsh)
        shell: pwsh
        run: |
          & ./scripts/check-install-ps1.ps1
          exit $LASTEXITCODE

      # Runs `Get-Content -Raw install.ps1 | iex` dot-sourced into the step's
      # session, exactly like a user's shell: installs the latest published
      # release through the normal checksum-verified download path, then
      # asserts `autter --version` resolves in the same session (PATH refresh),
      # a failing install throws instead of exiting the shell, and no
      # StrictMode/preferences/functions leak into the caller. Before that, a
      # dry run (AUTTER_INSTALL_DRY_RUN=1) must print its plan and create
      # nothing under a temporary profile directory, and a release that does
      # not exist must fail naming the URL and the npm route. After it, a
      # reinstall with AUTTER_INSTALL_PROGRESS=1 must show download progress.
      - name: End-to-end irm | iex install (Windows PowerShell 5.1)
        shell: powershell
        run: . ./scripts/test-install-ps1-iex.ps1

      # Same under PowerShell 7, as a reinstall over the 5.1 install above.
      - name: End-to-end irm | iex reinstall (pwsh)
        shell: pwsh
        run: . ./scripts/test-install-ps1-iex.ps1
