name: Tag release

# When `Cargo.toml` on main carries a version that does not yet have a `v*`
# tag, create the tag so the Release workflow publishes binaries + npm.
#
# Bump `version` in Cargo.toml (and Cargo.lock) in the PR you merge to main;
# this job tags `vX.Y.Z` on the merge commit and release.yml takes it from there.

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: write

jobs:
  tag:
    name: Tag from Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${tag}"
          git push origin "refs/tags/${tag}"
